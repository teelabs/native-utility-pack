name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify package and showcase
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: 20

      - name: Install package dependencies
        run: npm ci

      - name: Run package checks
        run: npm run ci

      - name: Install showcase dependencies
        working-directory: examples/showcase
        run: npm ci

      - name: Export Expo Web showcase
        working-directory: examples/showcase
        run: npm run build:web
